# Port the API listens on (the dashboard expects 8080)
server.port=8080

# Where course data is stored. A relative path is resolved from the folder you run the app in.
# The file is created automatically if it does not exist.
codecrafthub.data-file=courses.json

# Origins the browser dashboard may be served from (Live Server, file://, another port).
# Use * for local development; list specific origins for anything public.
codecrafthub.cors.allowed-origins=*

# Spring Boot's startup banner is replaced by our own messages
spring.main.banner-mode=off
